<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soutenance GANIL - Diapositives</title>
    <meta
      name="description"
      content="Diapositives GANIL avec transitions immersives: rack serveur, data tunnel, architecture 3D et blueprint scan."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-deep: #0f172a;
        --bg-night: #020617;
        --cyan: #22d3ee;
        --neon-blue: #38bdf8;
        --line-white: #e2e8f0;
        --transition-duration: 1420ms;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: Inter, sans-serif;
        background: radial-gradient(circle at 20% 0%, #14254d 0%, var(--bg-deep) 40%, var(--bg-night) 100%);
        color: #dbeafe;
        transition: background 260ms ease, color 260ms ease;
      }

      body.theme-dark {
        background: radial-gradient(circle at 20% 0%, #14254d 0%, #0d1d3f 34%, #060f23 65%, #020617 100%);
      }

      body.theme-light {
        background: radial-gradient(circle at 50% -10%, #1a315f 0%, #10264f 46%, #08142d 100%);
      }

      #progressTrack {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 70;
        width: 100%;
        height: 0.95rem;
        background: rgba(15, 23, 42, 0.64);
        border-bottom: 1px solid rgba(56, 189, 248, 0.42);
        backdrop-filter: blur(10px) saturate(130%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      #progressBar {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #2563eb, #0ea5e9 45%, #67e8f9 100%);
        box-shadow: 0 0 16px rgba(34, 211, 238, 0.75);
        transition: width 260ms ease;
      }

      #slideCounter {
        position: fixed;
        right: 1rem;
        top: 1.45rem;
        z-index: 80;
        min-width: 6.4rem;
        padding: 0.52rem 0.92rem;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-align: center;
        color: #dbeafe;
        background: rgba(8, 22, 52, 0.74);
        border: 1px solid rgba(103, 232, 249, 0.36);
        backdrop-filter: blur(14px) saturate(145%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 8px 24px rgba(2, 6, 23, 0.45);
      }

      #sessionDate {
        position: fixed;
        left: 1rem;
        top: 1.45rem;
        z-index: 80;
        min-width: 7.4rem;
        padding: 0.52rem 0.92rem;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-align: center;
        color: #dbeafe;
        background: rgba(8, 22, 52, 0.74);
        border: 1px solid rgba(103, 232, 249, 0.36);
        backdrop-filter: blur(14px) saturate(145%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 8px 24px rgba(2, 6, 23, 0.45);
      }

      #breadcrumb {
        position: fixed;
        left: 50%;
        top: 1.12rem;
        z-index: 86;
        display: flex;
        flex-wrap: nowrap;
        gap: 0.18rem;
        max-width: calc(100vw - 1.8rem);
        padding: 0.28rem 0.34rem;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.28);
        border: 1px solid rgba(148, 163, 184, 0.22);
        backdrop-filter: blur(12px) saturate(140%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        transform: translateX(-50%) translateY(-8px);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        overflow-x: auto;
        scrollbar-width: none;
        transition: opacity 220ms ease, transform 220ms ease;
      }

      #breadcrumb::-webkit-scrollbar {
        display: none;
      }

      .breadcrumb-item {
        appearance: none;
        border: 0;
        background: transparent;
        color: rgba(148, 163, 184, 0.9);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.012em;
        white-space: nowrap;
        padding: 0.22rem 0.42rem;
        border-radius: 999px;
        cursor: pointer;
        text-shadow: 0 0 10px rgba(148, 163, 184, 0.16);
        transition: color 180ms ease, background-color 180ms ease, font-size 220ms ease, text-shadow 180ms ease;
      }

      .breadcrumb-item:hover,
      .breadcrumb-item:focus-visible {
        color: rgba(203, 213, 225, 0.96);
        background: rgba(148, 163, 184, 0.14);
        text-shadow: 0 0 12px rgba(148, 163, 184, 0.32);
        outline: none;
      }

      .breadcrumb-item.active {
        color: #00f0ff;
        font-size: 0.76rem;
        font-weight: 800;
        background: rgba(0, 240, 255, 0.08);
        text-shadow: 0 0 14px rgba(0, 240, 255, 0.48);
      }

      #stage {
        position: fixed;
        inset: 0;
        padding: 1.15rem 0.65rem 0.65rem;
      }

      .slide {
        position: absolute;
        inset: 1.15rem 0.65rem 0.65rem;
        border-radius: 1.25rem;
        border: 1px solid rgba(56, 189, 248, 0.22);
        display: none;
        align-items: center;
        justify-content: center;
        padding: clamp(0.2rem, 0.9vw, 0.65rem);
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
        transition: opacity 320ms ease, transform 320ms ease, background 220ms ease, box-shadow 220ms ease;
        transform-style: preserve-3d;
      }

      .slide::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0) 42%),
          radial-gradient(circle at 85% 10%, rgba(103, 232, 249, 0.14), transparent 30%);
      }

      .slide[data-theme="dark"] {
        background: linear-gradient(145deg, rgba(7, 15, 34, 0.96), rgba(3, 8, 20, 0.96));
        box-shadow: 0 26px 58px rgba(2, 6, 23, 0.72);
      }

      .slide[data-theme="light"] {
        background: linear-gradient(145deg, rgba(9, 22, 50, 0.94), rgba(6, 16, 36, 0.94));
        box-shadow: 0 24px 54px rgba(2, 6, 23, 0.66);
      }

      .slide.active {
        display: flex;
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .slide.transition-out {
        display: flex;
        animation: slideSinkOut var(--transition-duration) cubic-bezier(0.15, 0.72, 0.22, 1) both;
      }

      .slide.transition-in {
        display: flex;
        animation: slideRiseIn var(--transition-duration) cubic-bezier(0.16, 0.74, 0.24, 1) both;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 0.95rem;
      }

      .slide[data-theme="dark"] img {
        background: #020617;
      }

      .slide[data-theme="light"] img {
        background: #ffffff;
      }

      #fxOverlay {
        position: fixed;
        inset: 0;
        z-index: 75;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        display: none;
      }

      #fxOverlay.transitioning {
        opacity: 1;
        visibility: visible;
        display: block;
      }

      #fxOverlay:not(.transitioning) .fx-layer {
        opacity: 0 !important;
        animation: none !important;
      }

      .fx-layer {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      .fx-dim {
        background:
          radial-gradient(circle at 50% 40%, rgba(15, 23, 42, 0.36), rgba(2, 6, 23, 0.88)),
          linear-gradient(180deg, rgba(2, 6, 23, 0.35), rgba(2, 6, 23, 0.85));
      }

      /* ---------- 1) RACK SERVEUR ---------- */
      .fx-rack {
        background:
          radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.1), transparent 40%),
          radial-gradient(circle at 70% 70%, rgba(34, 211, 238, 0.08), transparent 48%),
          linear-gradient(180deg, rgba(1, 5, 14, 0.98), rgba(2, 8, 22, 0.98));
        perspective: 900px;
      }

      .fx-rack .rack-side {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 20%;
        background: linear-gradient(
          90deg,
          rgba(2, 6, 23, 0.95) 0%,
          rgba(6, 18, 44, 0.92) 55%,
          rgba(10, 30, 70, 0.72) 100%
        );
        border-right: 1px solid rgba(56, 189, 248, 0.22);
        opacity: 0;
        transform-origin: center;
      }

      .fx-rack .rack-side.right {
        right: 0;
        left: auto;
        transform: scaleX(-1) skewY(-3deg) rotateY(16deg);
      }

      .fx-rack .rack-side.left {
        left: 0;
        transform: skewY(3deg) rotateY(-16deg);
      }

      .fx-rack .rack-lights {
        position: absolute;
        inset: 4% 10%;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(125, 211, 252, 1) 0 2px,
            rgba(15, 23, 42, 0.08) 2px 9px,
            rgba(56, 189, 248, 0.95) 9px 12px,
            rgba(2, 6, 23, 0.18) 12px 18px
          );
        box-shadow: inset 0 0 14px rgba(14, 165, 233, 0.48), 0 0 16px rgba(34, 211, 238, 0.32);
        opacity: 0;
      }

      .fx-rack .rack-center {
        position: absolute;
        inset: 0 14%;
        background:
          radial-gradient(circle at 50% 48%, rgba(14, 165, 233, 0.34), transparent 45%),
          linear-gradient(180deg, rgba(2, 6, 23, 0.18), rgba(2, 6, 23, 0.86));
        opacity: 0;
      }


      #fxOverlay.transitioning.effect-rack .fx-rack {
        opacity: 1;
        animation: rackOverlayCycle var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }

      #fxOverlay.transitioning.effect-rack .fx-dim {
        animation: dimPulse var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1);
      }

      #fxOverlay.transitioning.effect-rack .rack-side {
        animation: rackSideFlow var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }

      #fxOverlay.transitioning.effect-rack .rack-lights {
        animation: rackLightsRun var(--transition-duration) linear both;
      }

      #fxOverlay.transitioning.effect-rack .rack-center {
        animation: rackCenterDepth var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }


      /* ---------- 2) DATA TUNNEL ---------- */
      .fx-tunnel {
        background: #01040c;
      }

      .fx-tunnel .tunnel-grid {
        position: absolute;
        inset: -30%;
        background:
          repeating-linear-gradient(90deg, transparent 0 46px, rgba(34, 211, 238, 0.36) 47px 48px),
          repeating-linear-gradient(0deg, transparent 0 46px, rgba(56, 189, 248, 0.24) 47px 48px);
        transform-origin: center;
        opacity: 0;
      }

      .fx-tunnel .tunnel-rings {
        position: absolute;
        inset: -12%;
        background: repeating-radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.42) 0 2px, rgba(2, 6, 23, 0) 2px 56px);
        opacity: 0;
      }

      .fx-tunnel .data-rain {
        position: absolute;
        inset: 0;
        overflow: hidden;
        opacity: 0;
      }

      .fx-tunnel .data-rain span {
        position: absolute;
        top: -12%;
        left: calc(var(--x) * 1%);
        color: rgba(103, 232, 249, 0.82);
        font-size: calc(11px + var(--size) * 1px);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.75);
        transform: translateY(-20%) scale(calc(0.7 + var(--size) * 0.03));
      }

      #fxOverlay.transitioning.effect-tunnel .fx-tunnel {
        opacity: 1;
        animation: tunnelOverlayCycle var(--transition-duration) cubic-bezier(0.15, 0.72, 0.22, 1) both;
      }

      #fxOverlay.transitioning.effect-tunnel .fx-dim {
        animation: dimPulseStrong var(--transition-duration) cubic-bezier(0.15, 0.72, 0.22, 1) both;
      }

      #fxOverlay.transitioning.effect-tunnel .tunnel-grid {
        animation: tunnelGridDive var(--transition-duration) cubic-bezier(0.15, 0.72, 0.22, 1) both;
      }

      #fxOverlay.transitioning.effect-tunnel .tunnel-rings {
        animation: tunnelRingsDive var(--transition-duration) cubic-bezier(0.15, 0.72, 0.22, 1) both;
      }

      #fxOverlay.transitioning.effect-tunnel .data-rain {
        animation: tunnelRainOpacity var(--transition-duration) linear both;
      }

      #fxOverlay.transitioning.effect-tunnel .data-rain span {
        animation: dataBitFly var(--transition-duration) linear both;
        animation-delay: calc(var(--delay) * 1ms);
      }

      /* ---------- 3) BLUEPRINT SCAN ---------- */
      .fx-blueprint {
        background: #050d1f;
      }

      .fx-blueprint .blueprint-base,
      .fx-blueprint .blueprint-reveal {
        position: absolute;
        inset: 0;
      }

      .fx-blueprint .blueprint-base {
        background:
          linear-gradient(rgba(56, 189, 248, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56, 189, 248, 0.12) 1px, transparent 1px),
          radial-gradient(circle at 50% 48%, rgba(2, 132, 199, 0.2), transparent 55%),
          linear-gradient(180deg, #07122a 0%, #030914 100%);
        background-size: 40px 40px, 40px 40px, auto, auto;
      }

      .fx-blueprint .blueprint-reveal {
        background:
          linear-gradient(rgba(226, 232, 240, 0.14) 1px, transparent 1px),
          linear-gradient(90deg, rgba(226, 232, 240, 0.12) 1px, transparent 1px),
          repeating-linear-gradient(28deg, rgba(226, 232, 240, 0.14) 0 2px, transparent 2px 14px),
          radial-gradient(circle at 42% 45%, rgba(56, 189, 248, 0.3), transparent 55%),
          linear-gradient(180deg, #0b1f45 0%, #081a3a 100%);
        background-size: 40px 40px, 40px 40px, auto, auto, auto;
        clip-path: inset(0 100% 0 0);
      }

      .fx-blueprint .scan-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 14px;
        left: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(167, 243, 255, 0.95), rgba(255, 255, 255, 0));
        box-shadow: 0 0 24px rgba(103, 232, 249, 0.95), 0 0 64px rgba(34, 211, 238, 0.65);
        opacity: 0;
      }

      #fxOverlay.transitioning.effect-blueprint .fx-blueprint {
        opacity: 1;
        animation: blueprintOverlayCycle var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }

      #fxOverlay.transitioning.effect-blueprint .fx-dim {
        animation: dimPulse var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }

      #fxOverlay.transitioning.effect-blueprint .blueprint-reveal {
        animation: blueprintRevealCycle var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }

      #fxOverlay.transitioning.effect-blueprint .scan-line {
        animation: blueprintScanCycle var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }

      /* ---------- 4) ARCHITECTURE 3D STACK ---------- */
      .fx-stack {
        background: linear-gradient(180deg, rgba(2, 6, 23, 0.95), rgba(5, 14, 32, 0.95));
      }

      .fx-stack .stack-block {
        position: absolute;
        left: 50%;
        width: min(56vw, 820px);
        height: clamp(48px, 9vh, 86px);
        transform: translateX(-50%) translateY(-160%) scale(0.92);
        border-radius: 14px;
        border: 1px solid rgba(103, 232, 249, 0.36);
        background: linear-gradient(165deg, rgba(56, 189, 248, 0.25), rgba(10, 24, 56, 0.92));
        box-shadow: 0 16px 34px rgba(2, 6, 23, 0.56), inset 0 1px 0 rgba(255, 255, 255, 0.16);
        opacity: 0;
      }


      .fx-stack .stack-block.block-1 { top: 26%; }
      .fx-stack .stack-block.block-2 { top: 40%; width: min(58vw, 840px); }
      .fx-stack .stack-block.block-3 { top: 54%; width: min(48vw, 690px); }
      .fx-stack .stack-block.block-4 { top: 68%; width: min(44vw, 620px); }

      #fxOverlay.transitioning.effect-stack .fx-stack {
        opacity: 1;
        animation: stackOverlayCycle var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }

      #fxOverlay.transitioning.effect-stack .fx-dim {
        animation: dimPulseStrong var(--transition-duration) cubic-bezier(0.16, 0.72, 0.24, 1) both;
      }

      #fxOverlay.transitioning.effect-stack .stack-block.block-1 {
        animation: stackDrop1 var(--transition-duration) cubic-bezier(0.2, 0.78, 0.22, 1) both;
      }

      #fxOverlay.transitioning.effect-stack .stack-block.block-2 {
        animation: stackDrop2 var(--transition-duration) cubic-bezier(0.2, 0.78, 0.22, 1) both;
      }

      #fxOverlay.transitioning.effect-stack .stack-block.block-3 {
        animation: stackDrop3 var(--transition-duration) cubic-bezier(0.2, 0.78, 0.22, 1) both;
      }

      #fxOverlay.transitioning.effect-stack .stack-block.block-4 {
        animation: stackDrop4 var(--transition-duration) cubic-bezier(0.2, 0.78, 0.22, 1) both;
      }

      /* ---------- KEYFRAMES ---------- */
      @keyframes rackOverlayCycle {
        0% { opacity: 0; }
        14% { opacity: 1; }
        68% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes rackSideFlow {
        0% {
          opacity: 0;
          transform: translateZ(0) scaleY(1) translateX(0);
        }
        16% { opacity: 1; }
        64% {
          opacity: 0.95;
          transform: translateZ(0) scaleY(1.04) translateX(-4px);
        }
        100% {
          opacity: 0;
          transform: translateZ(0) scaleY(1.08) translateX(-8px);
        }
      }

      @keyframes rackLightsRun {
        0% {
          opacity: 0;
          background-position: 0 0;
          transform: perspective(780px) rotateY(0deg) scale(1.14);
        }
        16% { opacity: 1; }
        70% {
          opacity: 1;
          background-position: 0 260px;
          transform: perspective(780px) rotateY(0deg) scale(1.02);
        }
        100% {
          opacity: 0;
          background-position: 0 420px;
          transform: perspective(780px) rotateY(0deg) scale(0.94);
        }
      }

      @keyframes rackCenterDepth {
        0% {
          opacity: 0;
          transform: perspective(900px) translateZ(0) scale(1.2);
        }
        20% { opacity: 0.66; }
        66% {
          opacity: 0.72;
          transform: perspective(900px) translateZ(0) scale(1.02);
        }
        100% {
          opacity: 0;
          transform: perspective(900px) translateZ(0) scale(0.86);
        }
      }


      @keyframes dimPulse {
        0% { opacity: 0; }
        16% { opacity: 0.36; }
        52% { opacity: 0.58; }
        78% { opacity: 0.44; }
        100% { opacity: 0; }
      }

      @keyframes dimPulseStrong {
        0% { opacity: 0; }
        18% { opacity: 0.46; }
        50% { opacity: 0.72; }
        78% { opacity: 0.54; }
        100% { opacity: 0; }
      }

      @keyframes stackOverlayCycle {
        0% { opacity: 0; }
        12% { opacity: 1; }
        74% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes stackDrop1 {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(-180%) scale(0.9);
        }
        22% {
          opacity: 0.95;
          transform: translateX(-50%) translateY(8%) scale(1.02);
        }
        34% {
          transform: translateX(-50%) translateY(-3%) scale(0.99);
        }
        52%,
        74% {
          opacity: 0.92;
          transform: translateX(-50%) translateY(0%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(0%) scale(1);
        }
      }

      @keyframes stackDrop2 {
        0%,
        12% {
          opacity: 0;
          transform: translateX(-50%) translateY(-180%) scale(0.9);
        }
        34% {
          opacity: 0.95;
          transform: translateX(-50%) translateY(10%) scale(1.02);
        }
        46% {
          transform: translateX(-50%) translateY(-4%) scale(0.99);
        }
        64%,
        76% {
          opacity: 0.92;
          transform: translateX(-50%) translateY(0%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(0%) scale(1);
        }
      }

      @keyframes stackDrop3 {
        0%,
        24% {
          opacity: 0;
          transform: translateX(-50%) translateY(-180%) scale(0.9);
        }
        46% {
          opacity: 0.95;
          transform: translateX(-50%) translateY(12%) scale(1.02);
        }
        58% {
          transform: translateX(-50%) translateY(-5%) scale(0.99);
        }
        72%,
        80% {
          opacity: 0.92;
          transform: translateX(-50%) translateY(0%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(0%) scale(1);
        }
      }

      @keyframes stackDrop4 {
        0%,
        34% {
          opacity: 0;
          transform: translateX(-50%) translateY(-180%) scale(0.9);
        }
        56% {
          opacity: 0.95;
          transform: translateX(-50%) translateY(14%) scale(1.03);
        }
        68% {
          transform: translateX(-50%) translateY(-6%) scale(0.99);
        }
        78%,
        84% {
          opacity: 0.92;
          transform: translateX(-50%) translateY(0%) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(0%) scale(1);
        }
      }

      @keyframes tunnelOverlayCycle {
        0% { opacity: 0; }
        10% { opacity: 1; }
        72% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes tunnelGridDive {
        0% {
          opacity: 0;
          transform: perspective(780px) rotateX(76deg) scale(2.6) translateY(26%);
        }
        24% { opacity: 0.9; }
        66% {
          opacity: 0.86;
          transform: perspective(780px) rotateX(76deg) scale(1.16) translateY(2%);
        }
        100% {
          opacity: 0;
          transform: perspective(780px) rotateX(76deg) scale(0.72) translateY(-10%);
        }
      }

      @keyframes tunnelRingsDive {
        0% {
          opacity: 0;
          transform: scale(0.24);
        }
        28% { opacity: 0.74; }
        64% {
          opacity: 0.66;
          transform: scale(1.55);
        }
        100% {
          opacity: 0;
          transform: scale(2.55);
        }
      }

      @keyframes tunnelRainOpacity {
        0% { opacity: 0; }
        16% { opacity: 1; }
        70% { opacity: 0.92; }
        100% { opacity: 0; }
      }

      @keyframes dataBitFly {
        0% { transform: translateY(-35vh) scale(0.6); opacity: 0; }
        12% { opacity: 0.95; }
        68% { opacity: 0.75; }
        100% { transform: translateY(120vh) scale(1.5); opacity: 0; }
      }

      @keyframes blueprintOverlayCycle {
        0% { opacity: 0; }
        12% { opacity: 1; }
        72% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes blueprintRevealCycle {
        0% { clip-path: inset(0 100% 0 0); }
        48% { clip-path: inset(0 0% 0 0); }
        66% { clip-path: inset(0 0% 0 0); }
        100% { clip-path: inset(0 100% 0 0); }
      }

      @keyframes blueprintScanCycle {
        0% { left: -4%; opacity: 0; }
        18% { opacity: 1; }
        58% { left: 100%; opacity: 1; }
        100% { left: 104%; opacity: 0; }
      }

      @keyframes slideSinkOut {
        0% {
          transform: scale(1) translateZ(0) rotateX(0deg);
          filter: brightness(1) saturate(1);
        }
        56% {
          transform: scale(1.09) translateY(1.2%) rotateX(4deg);
          filter: brightness(1.04) saturate(1.05);
        }
        100% {
          transform: scale(0.82) translateY(5%) rotateX(14deg);
          filter: brightness(0.68) saturate(1.24);
        }
      }

      @keyframes slideRiseIn {
        0% {
          transform: scale(1.22) translateY(-4%) rotateX(-10deg);
          filter: brightness(1.2) saturate(1.15);
        }
        52% {
          transform: scale(1.03) translateY(0.5%) rotateX(1deg);
          filter: brightness(1.04) saturate(1.05);
        }
        100% {
          transform: scale(1) translateY(0) rotateX(0deg);
          filter: brightness(1) saturate(1);
        }
      }
    </style>
  </head>

  <body class="theme-dark">
    <div id="progressTrack"><div id="progressBar"></div></div>
    <div id="sessionDate">17/02/2026</div>
    <div id="slideCounter" aria-live="polite">1/15</div>
    <nav id="breadcrumb" aria-label="Fil d'Ariane"></nav>

    <main id="stage"></main>

    <div id="fxOverlay" aria-hidden="true">
      <div class="fx-layer fx-dim"></div>

      <div class="fx-layer fx-rack">
        <div class="rack-side left">
          <div class="rack-lights"></div>
        </div>
        <div class="rack-side right">
          <div class="rack-lights"></div>
        </div>
        <div class="rack-center"></div>
      </div>

      <div class="fx-layer fx-tunnel">
        <div class="tunnel-grid"></div>
        <div class="tunnel-rings"></div>
        <div id="dataRain" class="data-rain"></div>
      </div>

      <div class="fx-layer fx-blueprint">
        <div class="blueprint-base"></div>
        <div class="blueprint-reveal"></div>
        <div class="scan-line"></div>
      </div>

      <div class="fx-layer fx-stack">
        <div class="stack-block block-1"></div>
        <div class="stack-block block-2"></div>
        <div class="stack-block block-3"></div>
        <div class="stack-block block-4"></div>
      </div>
    </div>

    <script>
      const stage = document.getElementById("stage");
      const progressBar = document.getElementById("progressBar");
      const slideCounter = document.getElementById("slideCounter");
      const breadcrumb = document.getElementById("breadcrumb");
      const fxOverlay = document.getElementById("fxOverlay");
      const dataRain = document.getElementById("dataRain");

      const TRANSITION_DURATION = 1420;
      const SWAP_POINT_MS = 710;

      const slidesConfig = Array.from({ length: 15 }, (_, index) => {
        const number = String(index + 1).padStart(2, "0");
        return {
          src: `public/diapo/36abfcbf-${number}.png`,
          theme: index === 0 || index === 14 ? "dark" : "light",
        };
      });

      const slides = [];
      const breadcrumbItems = [];

      const breadcrumbSections = [
        { label: "INTRO", slides: [0], target: 0 },
        { label: "ENVIRONNEMENT", slides: [1, 2, 3, 4], target: 1 },
        { label: "ANALYSE", slides: [5, 6], target: 5 },
        { label: "SOLUTION", slides: [7, 8], target: 7 },
        { label: "RÉALISATION", slides: [9, 10, 11], target: 9 },
        { label: "QUOTIDIEN", slides: [12], target: 12 },
        { label: "BILAN", slides: [13, 14], target: 13 },
      ];

      let currentIndex = 0;
      let pendingIndex = 0;
      let transitionState = "idle";
      let wheelAccumulator = 0;
      let transitionSafetyTimer = null;

      const transitionEffectByEdge = {
        "0-1": "rack",
        "1-2": "blueprint",
        "2-3": "rack",
        "3-4": "rack",
        "4-5": "tunnel",
        "5-6": "rack",
        "6-7": "stack",
        "7-8": "stack",
        "8-9": "stack",
        "9-10": "rack",
        "10-11": "rack",
        "11-12": "blueprint",
        "12-13": "tunnel",
        "13-14": "rack",
      };

      function buildSlides() {
        const fragment = document.createDocumentFragment();

        slidesConfig.forEach((item, index) => {
          const section = document.createElement("section");
          section.className = "slide";
          section.dataset.theme = item.theme;

          const image = document.createElement("img");
          image.src = item.src;
          image.alt = `Diapositive ${index + 1}`;

          section.appendChild(image);
          fragment.appendChild(section);
          slides.push(section);
        });

        stage.appendChild(fragment);
      }

      function buildBreadcrumb() {
        const fragment = document.createDocumentFragment();

        breadcrumbSections.forEach((sectionConfig, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "breadcrumb-item";
          button.textContent = sectionConfig.label;
          button.dataset.sectionIndex = String(index);
          button.addEventListener("click", () => {
            goToSlide(sectionConfig.target);
          });

          fragment.appendChild(button);
          breadcrumbItems.push(button);
        });

        breadcrumb.appendChild(fragment);
      }

      function buildDataRain() {
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < 54; i += 1) {
          const bit = document.createElement("span");
          bit.textContent = Math.random() > 0.5 ? "1" : "0";
          bit.style.setProperty("--x", (2 + (i * 97) % 96).toString());
          bit.style.setProperty("--size", (10 + (i % 8)).toString());
          bit.style.setProperty("--delay", (i * 24).toString());
          fragment.appendChild(bit);
        }

        dataRain.appendChild(fragment);
      }

      function applyTheme(index) {
        const theme = slidesConfig[index].theme;
        document.body.classList.toggle("theme-light", theme === "light");
        document.body.classList.toggle("theme-dark", theme === "dark");
      }

      function updateCounter(index) {
        slideCounter.textContent = `${index + 1}/${slides.length}`;
      }

      function updateProgress(index) {
        const ratio = slides.length > 1 ? index / (slides.length - 1) : 0;
        progressBar.style.width = `${Math.max(0, Math.min(ratio * 100, 100))}%`;
      }

      function updateBreadcrumb(index) {
        const activeSectionIndex = breadcrumbSections.findIndex((sectionConfig) => {
          return sectionConfig.slides.includes(index);
        });

        breadcrumbItems.forEach((item, itemIndex) => {
          const isActive = itemIndex === activeSectionIndex;
          item.classList.toggle("active", isActive);
          item.setAttribute("aria-current", isActive ? "location" : "false");
        });
      }

      function normalizeSlideVisibility() {
        slides.forEach((slide, slideIndex) => {
          const shouldShow =
            slideIndex === currentIndex ||
            slide.classList.contains("transition-out") ||
            slide.classList.contains("transition-in");
          slide.style.display = shouldShow ? "flex" : "none";
        });
      }

      function showSlide(index) {
        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("active", slideIndex === index);
          slide.classList.remove("transition-out", "transition-in");
        });

        normalizeSlideVisibility();

        applyTheme(index);
        updateCounter(index);
        updateProgress(index);
        updateBreadcrumb(index);
      }

      function goToSlide(targetIndex) {
        if (transitionState !== "idle") {
          return;
        }

        const boundedTarget = Math.max(0, Math.min(targetIndex, slides.length - 1));
        if (boundedTarget === currentIndex) {
          return;
        }

        if (Math.abs(boundedTarget - currentIndex) === 1) {
          runTransition(boundedTarget > currentIndex ? 1 : -1);
          return;
        }

        currentIndex = boundedTarget;
        pendingIndex = boundedTarget;

        slides.forEach((slide, index) => {
          slide.classList.toggle("active", index === currentIndex);
          slide.classList.remove("transition-out", "transition-in");
        });

        normalizeSlideVisibility();
        applyTheme(currentIndex);
        updateCounter(currentIndex);
        updateProgress(currentIndex);
        updateBreadcrumb(currentIndex);
      }

      function getTargetIndex(step) {
        const target = currentIndex + step;
        return Math.max(0, Math.min(target, slides.length - 1));
      }

      function clearEffectClasses() {
        fxOverlay.classList.remove("effect-rack", "effect-stack", "effect-tunnel", "effect-blueprint", "transitioning");
        void fxOverlay.offsetHeight;
      }

      function getTransitionEffect(fromIndex, toIndex) {
        const edgeKey = `${Math.min(fromIndex, toIndex)}-${Math.max(fromIndex, toIndex)}`;
        return transitionEffectByEdge[edgeKey] || "blueprint";
      }

      function finalizeTransition() {
        transitionState = "idle";
        clearEffectClasses();

        if (transitionSafetyTimer) {
          clearTimeout(transitionSafetyTimer);
          transitionSafetyTimer = null;
        }

        slides.forEach((slide) => {
          slide.classList.remove("transition-out", "transition-in");
        });

        normalizeSlideVisibility();
      }

      function runTransition(step) {
        if (transitionState !== "idle") {
          return;
        }

        const targetIndex = getTargetIndex(step);
        if (targetIndex === currentIndex) {
          return;
        }

        pendingIndex = targetIndex;
        transitionState = "running";
        const effect = getTransitionEffect(currentIndex, targetIndex);

        const outgoing = slides[currentIndex];
        outgoing.classList.remove("transition-in");
        outgoing.classList.add("transition-out");
        normalizeSlideVisibility();

        clearEffectClasses();
        fxOverlay.classList.add(`effect-${effect}`);
        void fxOverlay.offsetWidth;
        fxOverlay.classList.add("transitioning");

        if (transitionSafetyTimer) {
          clearTimeout(transitionSafetyTimer);
        }
        transitionSafetyTimer = setTimeout(finalizeTransition, TRANSITION_DURATION + 180);

        window.setTimeout(() => {
          currentIndex = pendingIndex;
          slides.forEach((slide, index) => {
            slide.classList.toggle("active", index === currentIndex);
          });

          const incoming = slides[currentIndex];
          incoming.classList.remove("transition-out");
          incoming.classList.add("transition-in");
          normalizeSlideVisibility();

          applyTheme(currentIndex);
          updateCounter(currentIndex);
          updateProgress(currentIndex);
          updateBreadcrumb(currentIndex);
        }, SWAP_POINT_MS);
      }

      function move(step) {
        runTransition(step);
      }

      fxOverlay.addEventListener("animationend", (event) => {
        if (
          event.animationName !== "rackOverlayCycle" &&
          event.animationName !== "stackOverlayCycle" &&
          event.animationName !== "tunnelOverlayCycle" &&
          event.animationName !== "blueprintOverlayCycle"
        ) {
          return;
        }

        finalizeTransition();
      });

      document.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "ArrowRight" || event.code === "ArrowDown" || event.code === "PageDown") {
          event.preventDefault();
          move(1);
          return;
        }

        if (event.code === "ArrowLeft" || event.code === "ArrowUp" || event.code === "PageUp") {
          event.preventDefault();
          move(-1);
        }
      });

      document.addEventListener("click", (event) => {
        if (event.target.closest("a, button, input, textarea, select, label")) {
          return;
        }

        move(1);
      });

      document.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();

          if (transitionState !== "idle") {
            return;
          }

          wheelAccumulator += event.deltaY;
          if (Math.abs(wheelAccumulator) < 42) {
            return;
          }

          move(wheelAccumulator > 0 ? 1 : -1);
          wheelAccumulator = 0;
        },
        { passive: false }
      );

      buildSlides();
      buildBreadcrumb();
      buildDataRain();
      showSlide(currentIndex);
    </script>
  </body>
</html>
