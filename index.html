<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soutenance GANIL - Diapositives</title>
    <meta
      name="description"
      content="Diapositives de soutenance GANIL affichées en scrollytelling image par image."
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              slateNight: "#060b16",
              slateDeep: "#0b1220",
              electric: "#3b82f6",
            },
          },
        },
      };
    </script>

    <style>
      html {
        scroll-behavior: smooth;
        scroll-snap-type: y mandatory;
      }

      body {
        min-height: 100vh;
        margin: 0;
        line-height: 1.5;
        transition: background 260ms ease, color 260ms ease;
      }

      body.theme-dark {
        background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0b1220 42%, #060b16 100%);
        color: #e2e8f0;
      }

      body.theme-light {
        background: radial-gradient(circle at 50% -10%, #ffffff 0%, #eef2f7 52%, #dde5ef 100%);
        color: #0f172a;
      }

      main {
        padding: 0.6rem;
      }

      .slide {
        position: relative;
        height: calc(100vh - 1.2rem);
        min-height: calc(100vh - 1.2rem);
        scroll-snap-align: start;
        scroll-snap-stop: always;
        margin-bottom: 0.6rem;
        border-radius: 1.25rem;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(15, 23, 42, 0.75);
        box-shadow: 0 24px 50px rgba(2, 6, 23, 0.55);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(0.2rem, 0.9vw, 0.65rem);
        transition: background 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
      }

      .slide[data-theme="light"] {
        background: linear-gradient(135deg, #f8fafc 0%, #eff4f9 100%);
        border-color: rgba(148, 163, 184, 0.35);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2);
      }

      .slide[data-theme="dark"] {
        background: rgba(15, 23, 42, 0.75);
        border-color: rgba(148, 163, 184, 0.22);
      }

      .slide:last-child {
        margin-bottom: 0;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #020617;
        border-radius: 0.9rem;
      }

      .slide[data-theme="light"] img {
        background: #ffffff;
      }

      .slide[data-theme="dark"] img {
        background: #020617;
      }

      #progressTrack {
        background: rgba(15, 23, 42, 0.45);
        transition: background 220ms ease;
      }

      body.theme-light #progressTrack {
        background: rgba(148, 163, 184, 0.35);
      }

      #progressBar {
        background: linear-gradient(90deg, #3b82f6, #22d3ee);
      }
    </style>
  </head>

  <body class="theme-dark font-sans antialiased">
    <div id="progressTrack" class="fixed top-0 left-0 z-50 h-1.5 w-full">
      <div id="progressBar" class="h-full w-0 transition-[width] duration-150"></div>
    </div>

    <main class="relative overflow-x-hidden">
      <section class="slide" data-theme="dark"><img src="public/diapo/eeea412d-01.png" alt="Diapositive 1" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-02.png" alt="Diapositive 2" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-03.png" alt="Diapositive 3" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-04.png" alt="Diapositive 4" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-05.png" alt="Diapositive 5" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-06.png" alt="Diapositive 6" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-07.png" alt="Diapositive 7" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-08.png" alt="Diapositive 8" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-09.png" alt="Diapositive 9" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-10.png" alt="Diapositive 10" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-11.png" alt="Diapositive 11" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-12.png" alt="Diapositive 12" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-13.png" alt="Diapositive 13" /></section>
      <section class="slide" data-theme="light"><img src="public/diapo/eeea412d-14.png" alt="Diapositive 14" /></section>
      <section class="slide" data-theme="dark"><img src="public/diapo/eeea412d-15.png" alt="Diapositive 15" /></section>
    </main>

    <script>
      const progressBar = document.getElementById("progressBar");
      const slides = Array.from(document.querySelectorAll("main > section"));

      function getCurrentSlideIndex() {
        const probe = window.innerHeight * 0.45;
        const foundIndex = slides.findIndex((slide) => {
          const rect = slide.getBoundingClientRect();
          return rect.top <= probe && rect.bottom > probe;
        });
        return foundIndex === -1 ? 0 : foundIndex;
      }

      function goToSlide(index) {
        const bounded = Math.max(0, Math.min(index, slides.length - 1));
        slides[bounded].scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function moveSlide(step) {
        goToSlide(getCurrentSlideIndex() + step);
      }

      function applyUiThemeFromSlide(index) {
        const slide = slides[index];
        if (!slide) {
          return;
        }

        const theme = slide.dataset.theme === "light" ? "light" : "dark";
        document.body.classList.toggle("theme-light", theme === "light");
        document.body.classList.toggle("theme-dark", theme === "dark");
      }

      function updateReadingProgress() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = `${Math.min(progress, 100)}%`;
      }

      function updateViewportState() {
        updateReadingProgress();
        applyUiThemeFromSlide(getCurrentSlideIndex());
      }

      updateViewportState();
      window.addEventListener("scroll", updateViewportState, { passive: true });
      window.addEventListener("resize", updateViewportState);

      document.addEventListener("keydown", (event) => {
        if (event.code !== "Space") {
          return;
        }

        event.preventDefault();
        moveSlide(event.shiftKey ? -1 : 1);
      });

      document.addEventListener("click", () => {
        moveSlide(1);
      });
    </script>
  </body>
</html>
